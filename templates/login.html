<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>{{ '媒体模式 - 登录' if config.RUN_MODE != 'normal' else '密码登录' }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .login-card {
            background: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
            padding: 40px 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .login-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 24px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 25px;
            position: relative;
        }
        .text-input {
            width: 100%;
            height: 50px;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        .text-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .input-label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s ease;
            background: #fff;
            padding: 0 5px;
        }
        .text-input:focus ~ .input-label,
        .text-input:not(:placeholder-shown) ~ .input-label {
            top: 0;
            font-size: 14px;
            color: #667eea;
        }
        .login-btn {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .error-tip {
            color: #ff4444;
            font-size: 14px;
            margin-top: 8px;
            text-align: center;
        }
        .register-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #999;
        }
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="login-title">{{ '媒体模式登录' if config.RUN_MODE != 'normal' else '密码快速登录' }}</h2>

        <form method="post" action="">
            <div class="input-group">
                <input type="text" class="text-input" id="account" name="account" placeholder=" " required>
                <label class="input-label">账号</label>
            </div>
            <div class="input-group">
                <input type="password" class="text-input" id="password" name="password" placeholder=" " required>
                <label class="input-label">密码</label>
            </div>

            {% if error %}
            <div class="error-tip">{{ error }}</div>
            {% endif %}

            <button type="submit" class="login-btn">登录</button>
        </form>

        <div class="register-link">
            没有账户？<a href="/register">立即注册</a>
        </div>
    </div>
</body>
</html>
