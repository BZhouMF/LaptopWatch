<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaptopWatch</title>
<link rel="stylesheet" href="/static/css/setup.css">
</head>
<body>

<div class="app">

    <!-- 顶栏 -->
    <header class="header">
        <span class="logo">LaptopWatch</span>
        <div class="header-right">
            <nav class="tab-nav">
                <button class="tab-btn active" data-tab="console">控制台</button>
                <button class="tab-btn" data-tab="logs">日志</button>
                <button class="tab-btn" data-tab="advanced">高级设置</button>
            </nav>
            <div class="status-badge">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">未运行</span>
            </div>
        </div>
    </header>

    <!-- 控制台 -->
    <div class="tab-content active" id="tabConsole">
        <div class="scroll-wrap">
            <div class="scroll-inner">

                <!-- 运行模式 -->
                <div class="mode-grid">
                    <button class="mode-card active" data-mode="normal">
                        <div class="mode-card-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                        </div>
                        <span class="mode-card-label">普通</span>
                    </button>
                    <button class="mode-card" data-mode="video">
                        <div class="mode-card-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </div>
                        <span class="mode-card-label">视频</span>
                    </button>
                    <button class="mode-card" data-mode="image">
                        <div class="mode-card-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        </div>
                        <span class="mode-card-label">图片</span>
                    </button>
                    <button class="mode-card" data-mode="douyin">
                        <div class="mode-card-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="3"/><line x1="7" y1="7" x2="17" y2="17"/><circle cx="12" cy="12" r="4"/></svg>
                        </div>
                        <span class="mode-card-label">抖音</span>
                    </button>
                </div>

                <!-- 媒体目录 — 独占一行 -->
                <section class="card" id="sectionMediaDir">
                    <div class="dir-picker">
                        <input type="text" id="mediaDir" class="field-input"
                               placeholder="选择包含视频或图片的文件夹..." readonly disabled>
                        <button class="btn btn-outline" id="browseBtn" disabled>选择文件夹</button>
                    </div>
                </section>

                <!-- 排序 + 播放设置 -->
                <div class="row-2col">
                    <section class="card">
                        <h3 class="card-title">排序规则</h3>
                        <div class="sort-row">
                            <select id="sortType" class="field-input" disabled>
                                <option value="name">按名称</option>
                                <option value="time">按时间</option>
                            </select>
                            <select id="sortOrder" class="field-input" disabled>
                                <option value="asc">升序</option>
                                <option value="desc">降序</option>
                            </select>
                        </div>
                    </section>

                    <section class="card">
                        <h3 class="card-title">播放设置</h3>
                        <div class="toggle-list">
                            <label class="toggle-item">
                                <input type="checkbox" id="randomMode" disabled>
                                <span class="toggle-label">随机起始位置</span>
                            </label>
                            <label class="toggle-item" id="optionDouyinRandom">
                                <input type="checkbox" id="douyinRandom" disabled>
                                <span class="toggle-label">抖音随机切换</span>
                            </label>
                            <label class="toggle-item">
                                <input type="checkbox" id="categoryBrowse" disabled>
                                <span class="toggle-label">按目录浏览</span>
                            </label>
                        </div>
                    </section>
                </div>

                <!-- 服务控制 — 三态按钮 -->
                <section class="card card-service">
                    <div class="service-layout">
                        <!-- OFF: 启动服务器 -->
                        <div class="btn-col" id="btnColOff">
                            <button class="btn btn-start" id="startServerBtn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <span>启动服务器</span>
                            </button>
                        </div>
                        <!-- SERVER_ON: 启动服务 + 停止服务器 + 更新配置 -->
                        <div class="btn-col" id="btnColServerOn" style="display:none">
                            <button class="btn btn-start" id="activateServiceBtn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                                <span>启动服务</span>
                            </button>
                            <button class="btn btn-stop" id="stopServerBtn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                                <span>停止服务器</span>
                            </button>
                            <button class="btn btn-outline" id="applyConfigServerOnBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg>
                                <span>更新配置</span>
                            </button>
                        </div>
                        <!-- SERVICE_ACTIVE: 停用服务 + 停止服务器 + 更新配置 -->
                        <div class="btn-col" id="btnColActive" style="display:none">
                            <button class="btn btn-stop" id="deactivateServiceBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                                <span>停用服务</span>
                            </button>
                            <button class="btn btn-stop" id="stopServiceBtn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
                                <span>停止服务器</span>
                            </button>
                            <button class="btn btn-outline" id="applyConfigActiveBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22 6 12 13 2 6"/></svg>
                                <span>更新配置</span>
                            </button>
                        </div>
                        <div class="service-divider"></div>
                        <div class="qr-box" id="qrBox" style="display:none">
                            <span class="qr-placeholder" id="qrPlaceholder">启动后显示二维码</span>
                            <img id="qrImage" style="display:none" alt="QR Code">
                        </div>
                        <div class="service-url-group" id="urlGroup" style="display:none">
                            <input type="text" class="field-input mono" id="urlDisplay" value="—" readonly>
                            <button class="btn btn-outline" id="openBrowserBtn" disabled>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                                打开
                            </button>
                        </div>
                    </div>
                </section>

                <!-- 管理台 -->
                <section class="card">
                    <div class="qid-header">
                        <h3 class="card-title" style="margin-bottom:0">管理控制台</h3>
                        <span class="qid-badge" id="qidStatus">未启动</span>
                    </div>
                    <div class="qid-row">
                        <button class="btn btn-outline" id="qidActionBtn">启动管理台</button>
                        <button class="btn btn-outline" id="qidOpenBtn" disabled>打开面板</button>
                        <div class="qid-url-wrap" id="qidUrlField" style="display:none">
                            <input type="text" class="field-input mono" id="qidUrlDisplay" value="" readonly>
                        </div>
                    </div>
                </section>

            </div>
        </div>
    </div>

    <!-- 日志 -->
    <div class="tab-content" id="tabLogs">
        <div class="scroll-wrap">
            <div class="scroll-inner" style="flex:1">
                <div class="log-viewer" id="logViewer">
                    <div class="log-line dim">等待启动...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 高级设置 -->
    <div class="tab-content" id="tabAdvanced">
        <div class="scroll-wrap">
            <div class="scroll-inner">
                <section class="card">
                    <h3 class="card-title">安全设置</h3>
                    <p class="card-desc">修改登录密码。密码使用 SHA-256 + 随机盐哈希存储，不会保存明文。</p>
                    <button class="btn btn-outline" id="changePasswordBtn" style="margin-top:10px">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        修改密码
                    </button>
                </section>
            </div>
        </div>
    </div>

    <!-- 密码修改弹窗 -->
    <div class="modal-overlay" id="passwordModal" style="display:none">
        <div class="modal-card">
            <h3 class="modal-title">修改密码</h3>
            <form id="passwordForm">
                <div class="input-group">
                    <input type="password" class="text-input" id="newPassword" placeholder=" " required maxlength="64">
                    <label class="input-label">新密码</label>
                    <div class="char-hint">仅限数字、英文字母及 @ . _ - ! # $ % &amp; * +</div>
                    <div class="error-tip" id="pwdCharError" style="display:none">密码包含不允许的字符</div>
                </div>
                <div class="input-group">
                    <input type="password" class="text-input" id="confirmPassword" placeholder=" " required maxlength="64">
                    <label class="input-label">确认密码</label>
                    <div class="error-tip" id="confirmError" style="display:none">两次输入的密码不一致</div>
                </div>
                <div class="error-tip" id="modalError" style="display:none;text-align:center"></div>
                <div class="btn-row">
                    <button type="submit" class="btn btn-start btn-full">保存</button>
                    <button type="button" class="btn btn-outline" id="cancelPasswordBtn">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 底部状态栏 -->
    <footer class="footer-bar">
        <span id="footerStatus">就绪</span>
        <span id="footerRuntime"></span>
    </footer>

</div>

<script src="/static/js/setup.js"></script>
</body>
</html>
