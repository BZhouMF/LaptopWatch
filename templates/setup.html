<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LaptopWatch</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/setup.css') }}">
</head>
<body>

<div class="app">

    <!-- 标签栏 -->
    <div class="tab-bar">
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="console">控制台</button>
            <button class="tab-btn" data-tab="logs">日志</button>
        </div>
        <div class="status-badge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">未运行</span>
        </div>
    </div>
    <div class="tab-sep"></div>

    <!-- 控制台 -->
    <div class="tab-content active" id="tabConsole">
        <div class="scroll-wrap">
            <div class="scroll-inner">

                <!-- 运行模式 -->
                <div class="card">
                    <div class="card-title">运行模式</div>
                    <div class="segmented">
                        <button class="seg-btn active" data-mode="normal">普通</button>
                        <button class="seg-btn" data-mode="video">视频</button>
                        <button class="seg-btn" data-mode="image">图片</button>
                        <button class="seg-btn" data-mode="douyin">抖音</button>
                    </div>
                </div>

                <!-- 第一行：媒体配置 | 服务控制 -->
                <div class="row-2col">
                    <div class="card">
                        <div class="card-title">媒体配置</div>
                        <div class="form-group">
                            <label>媒体目录</label>
                            <div class="input-row">
                                <input type="text" id="mediaDir" placeholder="选择包含视频或图片的文件夹..." disabled>
                                <button class="btn btn-secondary" id="browseBtn" disabled>浏览</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>排序规则</label>
                            <div class="input-row">
                                <select id="sortType" disabled>
                                    <option value="name">按名称</option>
                                    <option value="time">按时间</option>
                                </select>
                                <select id="sortOrder" disabled>
                                    <option value="asc">升序</option>
                                    <option value="desc">降序</option>
                                </select>
                            </div>
                        </div>
                        <div class="checkbox-row">
                            <label><input type="checkbox" id="randomMode" disabled><span>随机位置</span></label>
                            <label><input type="checkbox" id="douyinRandom" disabled><span>随机媒体</span></label>
                            <label><input type="checkbox" id="categoryBrowse" disabled><span>目录浏览</span></label>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">服务控制</div>
                        <div class="center-stack">
                            <button class="btn btn-success btn-full" id="startBtn">启动服务</button>
                            <button class="btn btn-danger btn-full" id="stopBtn" disabled>停止服务</button>
                        </div>
                    </div>
                </div>

                <!-- 第二行：管理台 | 访问信息 -->
                <div class="row-2col">
                    <div class="card">
                        <div class="card-title">管理台</div>
                        <div class="qid-status" id="qidStatus">未启动</div>
                        <div class="btn-row-3">
                            <button class="btn btn-primary" id="qidStartBtn">启动</button>
                            <button class="btn btn-secondary" id="qidStopBtn" disabled>停止</button>
                            <button class="btn btn-secondary" id="qidOpenBtn" disabled>打开</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">访问信息</div>
                        <div class="qr-box">
                            <span class="qr-placeholder">启动服务后<br>显示二维码</span>
                        </div>
                        <input type="text" class="url-input" id="urlDisplay" value="—" readonly>
                        <button class="btn btn-secondary btn-full" id="openBrowserBtn" disabled>在浏览器中打开</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 日志 -->
    <div class="tab-content" id="tabLogs">
        <div class="log-viewer" id="logViewer">
            <div class="log-line dim">等待启动...</div>
        </div>
    </div>

    <!-- 底部状态栏 -->
    <div class="footer-bar">
        <span id="footerStatus">就绪</span>
        <span id="footerRuntime"></span>
    </div>

</div>

<script src="{{ url_for('static', filename='js/setup.js') }}"></script>
</body>
</html>
