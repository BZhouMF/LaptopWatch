<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ folder_name }} - {{ '视频模式' if config.RUN_MODE == 'video' else '图片模式' }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .grid-header {
            display: flex;
            align-items: center;
            padding: 12px 0;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--background);
        }
        .back-btn {
            padding: 6px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            text-decoration: none;
            margin-right: 14px;
        }
        .back-btn:hover {
            background: var(--surface-hover);
        }
        .grid-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            flex: 1;
        }
        .refresh-btn {
            padding: 6px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            text-decoration: none;
            margin-left: auto;
        }
        .refresh-btn:hover {
            background: var(--surface-hover);
        }
        .no-more {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 14px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            display: none;
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 24px 0;
            gap: 10px;
        }
        .page-btn {
            padding: 8px 16px;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        .page-btn:hover:not(:disabled) {
            background: #3a56d4;
        }
        .page-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .page-numbers {
            display: flex;
            gap: 5px;
        }
        .page-number {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .page-number:hover {
            background: #f0f0f0;
        }
        .page-number.current {
            background: #4361ee;
            color: white;
            border-color: #4361ee;
        }
        .page-number.disabled {
            background: #f0f0f0;
            color: #999;
            cursor: not-allowed;
            border-color: #e0e0e0;
        }
        .page-dots {
            padding: 6px 6px;
            color: #666;
        }
    </style>
</head>
<body>

    <!-- 页面头部 -->
    <div class="grid-header">
        {% if not hide_back %}
        <a href="{{ '/category/browse/' + parent_path if parent_path else '/' }}" class="back-btn">&larr; 返回</a>
        {% endif %}
        <h1>{{ folder_name }}</h1>
        <a href="/category/grid/{{ folder_path }}?refresh=1" class="refresh-btn">刷新</a>
    </div>

    <!-- 文件网格 -->
    <div id="mediaGrid" class="video-grid">
        {% for item in files %}
        <div class="video-card" onclick='openMedia({{ item.relative_path|tojson|safe }})'>
            <div class="video-thumb">
                {% if item.is_video or item.is_image %}
                <img src="{{ ROUTES.mediaThumbnail }}{{ item.relative_path }}" alt="{{ item.name }}" loading="lazy">
                {% endif %}
            </div>
            <div class="video-info">
                <div class="video-name" title="{{ item.name }}">{{ item.name }}</div>
            </div>
        </div>
        {% endfor %}
    </div>

    <!-- 分页 -->
    <div class="pagination" id="pagination">
        <button id="prevPage" class="page-btn" onclick="changePage(currentPage - 1)" disabled>上一页</button>
        <div class="page-numbers" id="pageNumbers"></div>
        <button id="nextPage" class="page-btn" onclick="changePage(currentPage + 1)">下一页</button>
    </div>

    <div class="loading" id="loading">加载中...</div>

    <script>window.ROUTES = {{ ROUTES | tojson }};</script>
    <script>
        function openMedia(relativePath) {
            sessionStorage.setItem('grid_page_' + GRID_CONFIG.folderPath, currentPage);
            window.location.href = window.ROUTES.mediaPlayer + '?path=' + encodeURIComponent(relativePath);
        }

        var GRID_CONFIG = {
            folderPath: {{ folder_path|tojson|safe }},
            pageSize: {{ page_size }}
        };
        var savedPage = parseInt(sessionStorage.getItem('grid_page_' + GRID_CONFIG.folderPath), 10);
        sessionStorage.removeItem('grid_page_' + GRID_CONFIG.folderPath);
        var currentPage = savedPage > 0 ? savedPage : 1;
        var hasMore = {{ has_more|tojson|safe }};
        var isLoading = false;
        var pageCache = {};

        // 缓存首页数据（服务端渲染的第一页）
        (function() {
            var items = [];
            {% for item in files %}
            items.push({
                relative_path: {{ item.relative_path|tojson|safe }},
                name: {{ item.name|tojson|safe }},
                is_video: {{ item.is_video|tojson|safe }},
                is_image: {{ item.is_image|tojson|safe }}
            });
            {% endfor %}
            pageCache[1] = { data: items, hasMore: hasMore };
        })();

        function updatePagination() {
            var prevBtn = document.getElementById('prevPage');
            var nextBtn = document.getElementById('nextPage');
            var pageNumbers = document.getElementById('pageNumbers');

            prevBtn.disabled = currentPage <= 1 || isLoading;
            nextBtn.disabled = !hasMore || isLoading;

            var pagesHtml = '';

            // 始终显示第 1 页
            if (currentPage === 1) {
                pagesHtml += '<span class="page-number current">1</span>';
            } else {
                pagesHtml += '<span class="page-number" onclick="changePage(1)">1</span>';
            }

            // 当前页 > 3 → 中间省略
            if (currentPage > 3) {
                pagesHtml += '<span class="page-dots">...</span>';
            }

            // 当前页附近的页码
            for (var i = Math.max(2, currentPage - 1); i <= currentPage + 1; i++) {
                if (i <= 1 || !pageCache[i] && !hasMore && i > currentPage) continue;
                if (i === currentPage) {
                    pagesHtml += '<span class="page-number current">' + i + '</span>';
                } else if (pageCache[i]) {
                    pagesHtml += '<span class="page-number" onclick="changePage(' + i + ')">' + i + '</span>';
                } else if (i === currentPage + 1 && hasMore) {
                    // 下一页尚未加载，显示为可点击的占位
                    pagesHtml += '<span class="page-number" onclick="changePage(' + i + ')">' + i + '</span>';
                }
            }

            // 如果还有更多页 → 尾部省略
            if (hasMore) {
                pagesHtml += '<span class="page-dots">...</span>';
            }

            pageNumbers.innerHTML = pagesHtml;
        }

        function changePage(page) {
            if (page < 1 || page === currentPage || isLoading) return;
            if (!hasMore && page > currentPage) return;

            currentPage = page;
            isLoading = true;
            document.getElementById('loading').style.display = 'block';
            updatePagination();
            loadPage(page);
        }

        function loadPage(page) {
            if (pageCache[page]) {
                renderPage(pageCache[page].data, page, pageCache[page].hasMore);
                return;
            }

            var offset = (page - 1) * GRID_CONFIG.pageSize;
            var url = window.ROUTES.categoryGridMore
                + '?path=' + encodeURIComponent(GRID_CONFIG.folderPath)
                + '&offset=' + offset
                + '&limit=' + GRID_CONFIG.pageSize;

            fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.code === 0) {
                        pageCache[page] = { data: data.data, hasMore: data.has_more };
                        renderPage(data.data, page, data.has_more);
                    } else {
                        isLoading = false;
                        updatePagination();
                    }
                })
                .catch(function(err) {
                    console.error('加载失败:', err);
                    isLoading = false;
                    updatePagination();
                });
        }

        function renderPage(items, page, more) {
            var grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';

            items.forEach(function(item) {
                var card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = function() { openMedia(item.relative_path); };
                var thumbHtml = (item.is_video || item.is_image)
                    ? '<img src="' + window.ROUTES.mediaThumbnail + encodeURIComponent(item.relative_path) + '" alt="' + item.name + '" loading="lazy">'
                    : '<div class="thumb-placeholder">' + (item.is_video ? 'VID' : 'IMG') + '</div>';
                card.innerHTML = '<div class="video-thumb">' + thumbHtml + '</div><div class="video-info"><div class="video-name" title="' + item.name + '">' + item.name + '</div></div>';
                grid.appendChild(card);
            });

            currentPage = page;
            hasMore = more;
            isLoading = false;
            document.getElementById('loading').style.display = 'none';
            updatePagination();
            window.scrollTo(0, 0);
        }

        if (currentPage > 1) {
            loadPage(currentPage);
        } else {
            updatePagination();
        }
    </script>
</body>
</html>
