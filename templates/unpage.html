    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="utf-8">
        <title>路径不存在</title>
        <style>
            body { background: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
            .error-container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
            .error-icon { font-size: 60px; margin-bottom: 20px; }
            .error-title { font-size: 24px; font-weight: bold; color: #ff3b30; margin-bottom: 10px; }
            .error-message { font-size: 16px; color: #666; margin-bottom: 30px; }
            .countdown { font-size: 14px; color: #999; margin-top: 20px; }
        </style>
    </head>
    <body>
        <div class="error-container">
            <div class="error-icon">[X]</div>
            <div class="error-title">路径不存在</div>
            <div class="error-message">您访问的文件夹可能已被删除或移动</div>
            <div class="countdown"><span id="seconds">3</span> 秒后自动返回上一页...</div>
        </div>
        <script>
            var seconds = 3;
            var countdownEl = document.getElementById('seconds');
            var interval = setInterval(function() {
                seconds--;
                countdownEl.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    // 获取上一页URL并添加刷新参数
                    var referrer = document.referrer;
                    if (referrer) {
                        try {
                            var url = new URL(referrer, window.location.origin);
                            url.searchParams.set('refresh', '1');
                            window.location.href = url.toString();
                        } catch (e) {
                            window.location.href = '/';
                        }
                    } else {
                        window.location.href = '/';
                    }
                }
            }, 1000);
        </script>
    </body>
    </html>
