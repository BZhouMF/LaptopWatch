<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>抖音模式 - LaptopWatch</title>
    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .douyin-container {
            width: 100%; height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        .douyin-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 4 / 3;
            object-fit: contain;
            background: #000;
            display: block;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }
        .douyin-video.slide-out-up { transform: translateY(-100%); }
        .douyin-video.slide-out-down { transform: translateY(100%); }
        .douyin-video.slide-in-from-bottom { transform: translateY(100%); }
        .douyin-video.slide-in-from-top { transform: translateY(-100%); }

        .douyin-container:fullscreen .douyin-video {
            max-width: none;
            max-height: none;
            aspect-ratio: auto;
            width: 100vw;
            height: 100vh;
            will-change: auto;
        }
        .douyin-container:-webkit-full-screen .douyin-video {
            max-width: none;
            max-height: none;
            aspect-ratio: auto;
            width: 100vw;
            height: 100vh;
            will-change: auto;
        }
        .douyin-video:fullscreen,
        .douyin-video:-webkit-full-screen { width: 100vw; height: 100vh; object-fit: contain; will-change: auto; }

        /* 底部控制栏 */
        .douyin-controls {
            position: absolute;
            left: 0; right: 0;
            bottom: 0;
            padding: 6px 12px calc(10px + var(--safe-bottom));
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 6px;
            opacity: 1;
            transition: opacity 0.4s;
            pointer-events: auto;
        }
        .douyin-controls.hidden { opacity: 0; pointer-events: none; }

        .douyin-btn-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .douyin-btn-right {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .douyin-btn {
            width: 32px; height: 32px;
            border: none; background: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0;
        }
        .douyin-btn svg { width: 22px; height: 22px; fill: #fff; }

        /* 设置按钮与菜单 */
        .douyin-settings-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .douyin-settings-menu {
            position: absolute;
            bottom: 42px;
            right: 0;
            background: rgba(0,0,0,0.88);
            border-radius: 8px;
            padding: 8px;
            display: none;
            z-index: 30;
            pointer-events: auto;
        }
        .douyin-settings-menu.show { display: flex; gap: 8px; }
        .douyin-settings-menu .settings-btn {
            color: #fff;
            font-size: 13px;
            padding: 8px 14px;
            cursor: pointer;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            border: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.15s;
        }
        .douyin-settings-menu .settings-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .douyin-settings-menu .settings-btn.mute-on {
            background: rgba(255,255,255,0.15);
        }
        .douyin-settings-menu .settings-btn .mute-icon {
            width: 16px; height: 16px;
            display: flex;
            align-items: center;
        }
        .douyin-settings-menu .speed-options {
            display: none;
            position: absolute;
            bottom: 0;
            right: 0;
            background: rgba(0,0,0,0.88);
            border-radius: 8px;
            padding: 4px 0;
            z-index: 31;
            min-width: 60px;
        }
        .douyin-settings-menu .speed-options.show { display: block; }
        .douyin-settings-menu .speed-options .speed-opt {
            color: #fff;
            font-size: 13px;
            padding: 7px 16px;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
        }
        .douyin-settings-menu .speed-options .speed-opt:hover,
        .douyin-settings-menu .speed-options .speed-opt.active {
            background: rgba(255,255,255,0.15);
        }

        /* 进度条容器 */
        .douyin-progress-wrap {
            width: 100%;
            height: 28px;
            display: flex;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .douyin-progress-bar {
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            position: relative;
        }
        .douyin-progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 2px;
            width: 0%;
            pointer-events: none;
        }
        .douyin-progress-thumb {
            position: absolute;
            top: 50%;
            width: 14px; height: 14px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            left: 0%;
            pointer-events: none;
        }

        /* 时间显示 */
        .douyin-time {
            color: #fff;
            font-size: 12px;
            flex-shrink: 0;
            min-width: 80px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .douyin-loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            display: none;
            z-index: 10;
            text-align: center;
        }
        .douyin-loading.active { display: block; }
        .douyin-loading .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .douyin-end {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            text-align: center;
            display: none;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 20px 32px;
            border-radius: 12px;
        }
        .douyin-end.active { display: block; }

        .douyin-error {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ff6b6b;
            font-size: 16px;
            text-align: center;
            display: none;
            z-index: 10;
            background: rgba(0,0,0,0.75);
            padding: 16px 24px;
            border-radius: 10px;
        }
        .douyin-error.active { display: block; }

        .douyin-info {
            position: absolute;
            left: 16px;
            top: calc(16px + env(safe-area-inset-top, 0px));
            z-index: 20;
            color: #fff;
            font-size: 14px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            max-width: calc(100% - 60px);
            pointer-events: none;
        }
        .douyin-info .name {
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .douyin-swipe-hint {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.4s;
        }

        /* 倍速指示器 */
        .douyin-speed-indicator {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 6px 14px;
        }
        .douyin-speed-indicator.active {
            opacity: 0.5;
            animation: speedPulse 0.6s ease-in-out infinite;
        }
        .douyin-speed-indicator .speed-text {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
        }
        .douyin-speed-indicator .speed-arrows {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            animation: arrowSlide 0.4s linear infinite;
        }
        @keyframes speedPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.06); }
        }
        @keyframes arrowSlide {
            0% { transform: translateX(0); }
            50% { transform: translateX(2px); }
            100% { transform: translateX(0); }
        }

        /* 快进快退指示器 */
        .douyin-seek-indicator {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.55);
            border-radius: 8px;
            padding: 6px 14px;
        }
        .douyin-seek-indicator.active { opacity: 1; }
        .douyin-seek-indicator .seek-arrow {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }
        .douyin-seek-indicator .seek-time {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 40px;
            text-align: center;
        }

        /* 亮度遮罩 */
        .brightness-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
        }

        /* 音量/亮度指示器 */
        .gesture-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 16;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            background: rgba(0,0,0,0.7);
            border-radius: 10px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 48px;
        }
        .gesture-indicator.active { opacity: 1; }
        .gesture-indicator.vol-indicator { left: 24px; }
        .gesture-indicator.bright-indicator { right: 24px; }
        .gesture-indicator .gi-icon {
            font-size: 20px;
            color: #fff;
            line-height: 1;
        }
        .gesture-indicator .gi-bar-wrap {
            width: 3px; height: 90px;
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
            position: relative;
        }
        .gesture-indicator .gi-bar-fill {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            background: #fff;
            border-radius: 2px;
        }
        .gesture-indicator .gi-pct {
            color: #fff;
            font-size: 11px;
            font-weight: 600;
        }

        /* 快进快退15秒按钮 */
        .skip-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 18;
            width: 6vw; height: 6vw;
            min-width: 36px; min-height: 36px;
            max-width: 56px; max-height: 56px;
            border: none;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }
        .skip-btn.show { opacity: 1; }
        .skip-btn:active { background: rgba(255,255,255,0.35); }
        .skip-btn.skip-back { left: 18%; }
        .skip-btn.skip-fwd { right: 18%; }
        .skip-btn svg { width: 55%; height: 55%; fill: #fff; }
    </style>
</head>
<body>
    <div class="douyin-container" id="container">
        <button class="skip-btn skip-back" id="btnSkipBack" title="后退15秒">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>
        <button class="skip-btn skip-fwd" id="btnSkipFwd" title="快进15秒">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
        </button>
        <div class="video-wrapper">
            <video class="douyin-video" id="videoA"
                   playsinline webkit-playsinline
                   preload="auto">
            </video>
            <video class="douyin-video slide-in-from-bottom" id="videoB"
                   playsinline webkit-playsinline
                   preload="auto">
            </video>
        </div>

        <!-- 底部控制栏 -->
        <div class="douyin-controls" id="controls">
            <div class="douyin-progress-wrap" id="progressWrap">
                <div class="douyin-progress-bar" id="progressBar">
                    <div class="douyin-progress-fill" id="progressFill"></div>
                    <div class="douyin-progress-thumb" id="progressThumb"></div>
                </div>
            </div>
            <div class="douyin-btn-row">
                <button class="douyin-btn" id="btnPlay" title="播放/暂停">
                    <svg id="btnPlaySvg" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <div class="douyin-btn-right">
                    <span class="douyin-time" id="timeDisplay">0:00 / 0:00</span>
                    <div class="douyin-settings-wrap" id="settingsWrap">
                        <button class="douyin-btn" id="btnSettings" title="设置">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41L9.25 5.35c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        </button>
                        <div class="douyin-settings-menu" id="settingsMenu"></div>
                    </div>
                    <button class="douyin-btn" id="btnFullscreen" title="全屏">
                        <svg id="btnFullscreenSvg" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="douyin-loading" id="loading">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>

        <div class="douyin-end" id="end">没有更多了</div>
        <div class="douyin-error" id="error"></div>

        <div class="douyin-info" id="info">
            <div class="name" id="infoName"></div>
        </div>

        <div class="douyin-swipe-hint" id="hint">↑ 上滑看下一个</div>
        <div class="douyin-speed-indicator" id="speedIndicator">
            <span class="speed-text">3x</span>
            <span class="speed-arrows">▶▶</span>
        </div>
        <div class="brightness-overlay" id="brightnessOverlay"></div>
        <div class="gesture-indicator vol-indicator" id="volIndicator">
            <div class="gi-bar-wrap"><div class="gi-bar-fill" id="volFill"></div></div>
            <span class="gi-pct" id="volPct">100%</span>
        </div>
        <div class="gesture-indicator bright-indicator" id="brightIndicator">
            <div class="gi-bar-wrap"><div class="gi-bar-fill" id="brightFill"></div></div>
            <span class="gi-pct" id="brightPct">100%</span>
        </div>
        <div class="douyin-seek-indicator" id="seekIndicator">
            <span class="seek-arrow">◀</span>
            <span class="seek-time" id="seekTime">0:00</span>
            <span class="seek-arrow">▶</span>
        </div>
    </div>

    <script>window.ROUTES = {{ ROUTES | tojson }};</script>
    <script>
    window.DOUYIN_CONFIG = {
        autoPlay: {{ 'true' if auto_play else 'false' }},
        muted: {{ 'true' if muted else 'false' }}
    };
    </script>
    <script src="{{ url_for('static', filename='js/Video_Player.js') }}"></script>
</body>
</html>
