<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{ media_name }} - LaptopWatch</title>
    <style>
        :root { --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-top: env(safe-area-inset-top, 0px); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; }

        .player-container { width: 100%; height: 100%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
        .video-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
        .player-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: block; will-change: transform; }
        .player-video.slide-out-up { transform: translateY(-100%); }
        .player-video.slide-out-down { transform: translateY(100%); }
        .player-video.slide-in-from-bottom { transform: translateY(100%); }
        .player-video.slide-in-from-top { transform: translateY(-100%); }

        .player-image { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 100%; max-height: 100%; object-fit: contain; display: none; }

        /* 顶部栏 */
        .player-top-bar {
            position: absolute; top: 0; left: 0; right: 0; z-index: 20;
            padding: calc(8px + var(--safe-top)) 12px 8px;
            background: linear-gradient(rgba(0,0,0,0.6), transparent);
            display: flex; align-items: center; gap: 10px;
            opacity: 1; transition: opacity 0.4s;
        }
        .player-top-bar.hidden { opacity: 0; pointer-events: none; }
        .player-back-btn {
            width: 32px; height: 32px; border: none; background: rgba(255,255,255,0.15); color: #fff;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 18px; line-height: 1;
        }
        .player-back-btn:hover { background: rgba(255,255,255,0.3); }
        .player-filename {
            color: #fff; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* 底部控制栏 */
        .player-controls {
            position: absolute; left: 0; right: 0; bottom: 0;
            padding: 6px 12px calc(10px + var(--safe-bottom));
            background: linear-gradient(transparent, rgba(0,0,0,0.7)); z-index: 20;
            display: flex; flex-direction: column; gap: 6px;
            opacity: 1; transition: opacity 0.4s; pointer-events: auto;
        }
        .player-controls.hidden { opacity: 0; pointer-events: none; }
        .player-controls.video-only { display: flex; }
        .player-controls.video-only.hidden { display: none; }

        .player-btn-row { display: flex; align-items: center; gap: 10px; }
        .player-btn-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .player-btn { width: 32px; height: 32px; border: none; background: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0; }
        .player-btn svg { width: 22px; height: 22px; fill: #fff; }

        .player-time { color: #fff; font-size: 12px; flex-shrink: 0; min-width: 80px; text-align: right; font-variant-numeric: tabular-nums; }

        /* 进度条 */
        .player-progress-wrap { width: 100%; height: 28px; display: flex; align-items: center; cursor: pointer; flex-shrink: 0; }
        .player-progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; position: relative; }
        .player-progress-fill { height: 100%; background: #fff; border-radius: 2px; width: 0%; pointer-events: none; }
        .player-progress-thumb { position: absolute; top: 50%; width: 14px; height: 14px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); left: 0%; pointer-events: none; }

        .player-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 16px; display: none; z-index: 10; text-align: center; }
        .player-loading.active { display: block; }
        .player-loading .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .player-error { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff6b6b; font-size: 16px; text-align: center; display: none; z-index: 10; background: rgba(0,0,0,0.75); padding: 16px 24px; border-radius: 10px; }
        .player-error.active { display: block; }

        .player-nav-btns {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 18; display: flex; gap: 20px; opacity: 0; transition: opacity 0.3s;
        }
        .player-nav-btns.show { opacity: 1; }
        .player-nav-btn {
            width: 48px; height: 48px; border: none; background: rgba(255,255,255,0.15); color: #fff;
            border-radius: 50%; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;
        }
        .player-nav-btn:active { background: rgba(255,255,255,0.35); }
        .player-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* 亮度遮罩 */
        .brightness-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; opacity: 0; pointer-events: none; z-index: 3; }

        /* 设置菜单 */
        .player-settings-wrap { position: relative; flex-shrink: 0; }
        .player-settings-menu { position: absolute; bottom: 42px; right: 0; background: rgba(0,0,0,0.88); border-radius: 8px; padding: 8px; display: none; z-index: 30; pointer-events: auto; }
        .player-settings-menu.show { display: flex; gap: 8px; }
        .player-settings-menu .settings-btn { color: #fff; font-size: 13px; padding: 8px 14px; cursor: pointer; border-radius: 6px; background: rgba(255,255,255,0.1); border: none; white-space: nowrap; display: flex; align-items: center; gap: 4px; }
        .player-settings-menu .settings-btn:hover { background: rgba(255,255,255,0.2); }
        .player-settings-menu .speed-options { display: none; position: absolute; bottom: 0; right: 0; background: rgba(0,0,0,0.88); border-radius: 8px; padding: 4px 0; z-index: 31; min-width: 60px; }
        .player-settings-menu .speed-options.show { display: block; }
        .player-settings-menu .speed-options .speed-opt { color: #fff; font-size: 13px; padding: 7px 16px; cursor: pointer; text-align: center; white-space: nowrap; }
        .player-settings-menu .speed-options .speed-opt:hover,
        .player-settings-menu .speed-options .speed-opt.active { background: rgba(255,255,255,0.15); }

        .player-seek-indicator { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); z-index: 15; pointer-events: none; opacity: 0; transition: opacity 0.15s; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.55); border-radius: 8px; padding: 6px 14px; }
        .player-seek-indicator.active { opacity: 1; }
        .player-seek-indicator .seek-time { color: #fff; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

        .player-speed-indicator { position: absolute; top: 8%; left: 50%; transform: translateX(-50%); z-index: 15; pointer-events: none; opacity: 0; transition: opacity 0.2s; background: rgba(255,255,255,0.12); border-radius: 8px; padding: 6px 14px; }
        .player-speed-indicator.active { opacity: 0.5; }
        .player-speed-indicator .speed-text { color: #fff; font-size: 16px; font-weight: 600; }

        .gesture-indicator { position: absolute; top: 50%; transform: translateY(-50%); z-index: 16; pointer-events: none; opacity: 0; transition: opacity 0.2s; background: rgba(0,0,0,0.7); border-radius: 10px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 48px; }
        .gesture-indicator.active { opacity: 1; }
        .gesture-indicator.vol-indicator { left: 24px; }
        .gesture-indicator.bright-indicator { right: 24px; }
        .gesture-indicator .gi-bar-wrap { width: 3px; height: 90px; background: rgba(255,255,255,0.25); border-radius: 2px; position: relative; }
        .gesture-indicator .gi-bar-fill { position: absolute; bottom: 0; left: 0; width: 100%; background: #fff; border-radius: 2px; }
        .gesture-indicator .gi-pct { color: #fff; font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="player-container" id="container">
        <!-- 顶部栏 -->
        <div class="player-top-bar" id="topBar">
            <button class="player-back-btn" id="btnBack" title="返回">&larr;</button>
            <span class="player-filename" id="fileName">{{ media_name }}</span>
        </div>

        <!-- 视频元素（双缓冲） -->
        <div class="video-wrapper" id="videoWrap" style="display:none">
            <video class="player-video" id="videoA" playsinline webkit-playsinline preload="auto"></video>
            <video class="player-video" id="videoB" playsinline webkit-playsinline preload="auto"></video>
        </div>

        <!-- 图片元素 -->
        <img class="player-image" id="playerImage" alt="" style="display:none">

        <!-- 底部控制栏（视频专用） -->
        <div class="player-controls video-only" id="controls">
            <div class="player-progress-wrap" id="progressWrap">
                <div class="player-progress-bar" id="progressBar">
                    <div class="player-progress-fill" id="progressFill"></div>
                    <div class="player-progress-thumb" id="progressThumb"></div>
                </div>
            </div>
            <div class="player-btn-row">
                <button class="player-btn" id="btnPlay" title="播放/暂停">
                    <svg id="btnPlaySvg" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <div class="player-btn-right">
                    <span class="player-time" id="timeDisplay">0:00 / 0:00</span>
                    <div class="player-settings-wrap" id="settingsWrap">
                        <button class="player-btn" id="btnSettings" title="设置">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41L9.25 5.35c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        </button>
                        <div class="player-settings-menu" id="settingsMenu"></div>
                    </div>
                    <button class="player-btn" id="btnFullscreen" title="全屏">
                        <svg id="btnFullscreenSvg" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 导航按钮 -->
        <div class="player-nav-btns" id="navBtns">
            <button class="player-nav-btn" id="btnPrev" title="上一个">&#9650;</button>
            <button class="player-nav-btn" id="btnNext" title="下一个">&#9660;</button>
        </div>

        <div class="player-loading" id="loading"><div class="spinner"></div><div>加载中...</div></div>
        <div class="player-error" id="error"></div>
        <div class="brightness-overlay" id="brightnessOverlay"></div>

        <div class="player-seek-indicator" id="seekIndicator">
            <span class="seek-time" id="seekTime">0:00</span>
        </div>
        <div class="player-speed-indicator" id="speedIndicator">
            <span class="speed-text" id="speedText">3x</span>
        </div>
        <div class="gesture-indicator vol-indicator" id="volIndicator">
            <div class="gi-bar-wrap"><div class="gi-bar-fill" id="volFill"></div></div>
            <span class="gi-pct" id="volPct">100%</span>
        </div>
        <div class="gesture-indicator bright-indicator" id="brightIndicator">
            <div class="gi-bar-wrap"><div class="gi-bar-fill" id="brightFill"></div></div>
            <span class="gi-pct" id="brightPct">100%</span>
        </div>
    </div>

    <script>window.ROUTES = {{ ROUTES | tojson }};</script>
    <script>
    window.DOUYIN_CONFIG = {
        mode: 'grid',
        muted: true,
        mediaPath: {{ media_path|tojson|safe }},
        isVideo: {{ is_video|tojson|safe }}
    };
    </script>
    <script src="{{ url_for('static', filename='js/Video_Player.js') }}"></script>
</body>
</html>
