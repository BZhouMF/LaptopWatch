<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ filename }} - 文本查看器</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="header">
        <div class="filename-info">
            <div class="filename">{{ filename }}</div>
            <div class="encoding">编码: {{ encoding }}</div>
        </div>
        <div class="actions">
            <a href="{{ ROUTES.fileRaw }}{{ filepath }}" class="btn btn-secondary" download>
                 下载文件
            </a>
            <button onclick="copyToClipboard()" class="btn btn-secondary">
                 复制内容
            </button>
            <a href="javascript:history.back()" class="btn">
                 返回
            </a>
        </div>
    </div>

    <div class="content" id="textContent">{{ content }}</div>

    <div class="footer">
        文件大小: {{ file_size }} | 总行数: <span id="lineCount">0</span>
    </div>

    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
</body>
</html>
