<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>注册账号</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .register-card {
            background: #fff;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
            padding: 40px 30px;
        }
        .register-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 24px;
            font-weight: 600;
        }
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        .text-input {
            width: 100%;
            height: 50px;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        .text-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .input-label {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
            pointer-events: none;
            transition: all 0.3s ease;
            background: #fff;
            padding: 0 5px;
        }
        .text-input:focus ~ .input-label,
        .text-input:not(:placeholder-shown) ~ .input-label {
            top: 0;
            font-size: 14px;
            color: #667eea;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
        .register-btn {
            flex: 1;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        .back-btn {
            width: 100px;
            height: 50px;
            background: #f0f0f0;
            border: 1px solid #e1e1e1;
            border-radius: 8px;
            color: #666;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: #e5e5e5;
        }
        .error-tip {
            color: #ff4444;
            font-size: 14px;
            margin-top: 6px;
        }
        .field-error {
            border-color: #ff4444 !important;
        }
        .char-hint {
            color: #999;
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <h2 class="register-title">注册账号</h2>

        <form method="post" action="" id="registerForm">
            <div class="input-group">
                <input type="text" class="text-input" id="account" name="account" placeholder=" " required autocomplete="off" maxlength="32">
                <label class="input-label">请输入账号</label>
                <div class="char-hint">仅限数字、英文字母及 @ . _ - ! # $ % &amp; * +</div>
                <div class="error-tip" id="accountError" style="display:none;">账号包含不允许的字符</div>
            </div>
            <div class="input-group">
                <input type="password" class="text-input" id="password" name="password" placeholder=" " required maxlength="64">
                <label class="input-label">请输入密码</label>
                <div class="char-hint">仅限数字、英文字母及 @ . _ - ! # $ % &amp; * +</div>
                <div class="error-tip" id="passwordError" style="display:none;">密码包含不允许的字符</div>
            </div>
            <div class="input-group">
                <input type="password" class="text-input" id="confirm_password" name="confirm_password" placeholder=" " required maxlength="64">
                <label class="input-label">请再次输入密码</label>
                <div class="error-tip" id="confirmError" style="display:none;">两次输入的密码不一致</div>
            </div>

            {% if error %}
            <div class="error-tip">{{ error }}</div>
            {% endif %}

            <div class="btn-row">
                <button type="submit" class="register-btn">注册</button>
                <button type="button" class="back-btn" onclick="window.location.href='/login'">返回</button>
            </div>
        </form>
    </div>

    <script>
    var ALLOWED_CHARS = /^[a-zA-Z0-9@._\-!#$%&*+]+$/;

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        var account = document.getElementById('account');
        var pwd = document.getElementById('password');
        var confirmPwd = document.getElementById('confirm_password');
        var accountErr = document.getElementById('accountError');
        var pwdErr = document.getElementById('passwordError');
        var confirmErr = document.getElementById('confirmError');
        var valid = true;

        if (!ALLOWED_CHARS.test(account.value)) {
            e.preventDefault();
            account.classList.add('field-error');
            accountErr.style.display = 'block';
            valid = false;
        } else {
            account.classList.remove('field-error');
            accountErr.style.display = 'none';
        }

        if (!ALLOWED_CHARS.test(pwd.value)) {
            e.preventDefault();
            pwd.classList.add('field-error');
            pwdErr.style.display = 'block';
            valid = false;
        } else {
            pwd.classList.remove('field-error');
            pwdErr.style.display = 'none';
        }

        if (pwd.value !== confirmPwd.value) {
            e.preventDefault();
            confirmPwd.classList.add('field-error');
            confirmErr.style.display = 'block';
            valid = false;
        } else {
            confirmPwd.classList.remove('field-error');
            confirmErr.style.display = 'none';
        }
    });

    document.getElementById('account').addEventListener('input', function() {
        this.classList.remove('field-error');
        document.getElementById('accountError').style.display = 'none';
    });
    document.getElementById('password').addEventListener('input', function() {
        this.classList.remove('field-error');
        document.getElementById('passwordError').style.display = 'none';
    });
    document.getElementById('confirm_password').addEventListener('input', function() {
        this.classList.remove('field-error');
        document.getElementById('confirmError').style.display = 'none';
    });
    </script>
</body>
</html>
