<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件浏览</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .browse-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--background);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 200;
        }
        .browse-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .browse-header .sidebar-toggle {
            position: static;
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 16px;
        }
        .browse-logo {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .browse-path {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            direction: rtl;
            text-align: left;
        }
        .browse-header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .browse-home-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 16px;
            transition: all 0.2s;
        }
        .browse-home-btn:hover {
            background: var(--surface-hover);
            color: var(--text-primary);
            border-color: var(--border-hover);
        }

        .browse-main {
            padding: 0 16px 16px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .browse-main h1 {
            display: none;
        }

        @media (max-width: 640px) {
            .browse-header {
                padding: 8px 12px;
            }
            .browse-logo {
                font-size: 13px;
            }
            .browse-path {
                font-size: 11px;
                max-width: 120px;
            }
            .browse-main {
                padding: 0 8px 8px;
            }
        }
    </style>
</head>
<body>

    <header class="browse-header">
        <div class="browse-header-left">
            <button id="sidebarToggle" class="sidebar-toggle" title="控制面板">&#9776;</button>
            <span class="browse-logo">LaptopWatch</span>
            <span class="browse-path" title="{{ abs_path }}">{{ abs_path }}</span>
        </div>
        <div class="browse-header-right">
            <a href="/" class="browse-home-btn" title="首页">&#8962;</a>
        </div>
    </header>

    <!-- 侧边栏遮罩 -->
    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <!-- 侧边栏 -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span>控制面板</span>
        </div>
        <div class="sidebar-content">
            <div class="controls">
                <div class="control-group">
                    <a href="/" class="btn btn-secondary"> 首页</a>
                    <button id="refreshBtn" class="btn" onclick="refreshCurrentDir()"> 刷新</button>
                    <button id="downloadBtn" class="btn btn-secondary" onclick="toggleSelectionMode()"> 下载</button>
                </div>
                <div class="control-group">
                    <button id="backPageBtn" class="btn" onclick="goBackPage()"> 返回上一页</button>
                    <a href="{{ parent_link }}" class="btn">{{ btn_text }}</a>
                </div>
                <div class="control-group">
                    <select id="viewSelect" onchange="changeView()">
                        <option value="large">大图标</option>
                        <option value="medium">中图标</option>
                        <option value="small">小图标</option>
                        <option value="list">详细信息</option>
                    </select>
                    <select id="sortSelect" onchange="changeSort()">
                        <option value="name">按名称</option>
                        <option value="date">按时间</option>
                        <option value="size">按大小</option>
                    </select>
                    <button id="orderToggle" class="btn" onclick="toggleOrder()"> 升序</button>
                </div>
            </div>
        </div>
    </div>

    <div class="browse-main">
        <h1>{{ abs_path }}</h1>

        <div id="folderContainer" class="view-container"></div>
        <div id="fileContainer" class="view-container">
            <div id="listHeader" class="header" style="display:none;"></div>
        </div>

        <div id="errorMsg" class="error-msg" style="display:none;"></div>
        <div id="emptyMsg" class="empty-msg" style="display:none;">此文件夹为空</div>
        <div id="loader" class="loader">正在加载...</div>
        <div id="endMsg" class="end-msg" style="display:none;">已加载全部</div>

        <div id="selectionBar" class="selection-bar" style="display: none;">
            <div class="selection-info">
                <span id="selectedCount">0</span> 个项目已选中
            </div>
            <div class="selection-options">
                <label><input type="radio" name="downloadMode" value="merge" checked> 合并下载</label>
                <label><input type="radio" name="downloadMode" value="separate"> 分别下载</label>
            </div>
            <div class="selection-buttons">
                <button class="btn" onclick="selectAll()">全选</button>
                <button class="btn" onclick="cancelSelection()">取消</button>
                <button class="btn btn-primary" onclick="downloadSelected()">确定下载</button>
            </div>
        </div>
    </div>

    <div id="previewModal" class="modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <div id="modalContent"></div>
        <a id="modalDownload" class="modal-download" href="#" download>下载原文件</a>
        <div id="modalTip" class="modal-tip"></div>
    </div>

    <script>window.ROUTES = {{ ROUTES | tojson }};</script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script>
        const absPath = {{ abs_path | tojson }};
        const MAX_HISTORY_LENGTH = {{ MAX_HISTORY_LENGTH }};
    </script>
    <script src="{{ url_for('static', filename='js/browse.js') }}"></script>
</body>
</html>
